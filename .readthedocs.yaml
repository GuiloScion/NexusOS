# Read the Docs configuration. https://docs.readthedocs.io/en/stable/config-file/v2.html
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"
  # System libraries WeasyPrint needs for the mkdocs-with-pdf export.
  apt_packages:
    - libpango-1.0-0
    - libpangoft2-1.0-0
    - libpangocairo-1.0-0
    - libgdk-pixbuf-2.0-0

mkdocs:
  configuration: mkdocs.yml

python:
  install:
    - requirements: docs/requirements.txt
