name: track-downloads

on:
  schedule:
    - cron: '17 6 * * *'    # daily at 06:17 UTC (off-peak)
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Run tracker
        env:
          GITHUB_REPO: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/track_downloads.py

      - name: Commit history update
        shell: bash
        run: |
          if [[ -n "$(git status --porcelain data/download_history.csv)" ]]; then
            git config user.name "nexusos-stats-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/download_history.csv
            git commit -m "chore(stats): daily download snapshot"
            git push
          else
            echo "No changes to commit."
          fi
